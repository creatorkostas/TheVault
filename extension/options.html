<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 14px system-ui; padding: 12px; background: #f6f2e8; color: #292524; }
    input { width: 320px; padding: 7px; border-radius: 8px; border: 1px solid #dac4b1; background: #fff; color: #292524; }
    button { padding: 7px 14px; border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; background: #ca503d; color: #fff; }

</head>
<body>
  <h3>Enthymio Clipper settings</h3>
  <label>Vault base URL:
    <input id="enthymioUrl" placeholder="http://localhost:3000" />
  </label>
  <br /><br />
  <label>API token (Settings in the vault → New token):
    <input id="apiToken" placeholder="et_…" />
  </label>
  <br /><br />
  <button id="save">Save</button>
  <span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
